name: ci
on:
  push:
    branches: [main]
  pull_request:

# Read-only: tests and pull requests can't write to the repo or publish anything.
permissions:
  contents: read

# Third-party actions are pinned to exact commits (a moved tag can't change what runs);
# Dependabot proposes updates.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web app and the binary
        run: make build
      - name: Go vet, Go tests, TypeScript check
        run: make test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: The Docker image builds
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: hotaisle-ui:ci
      - name: and serves the app
        run: |
          docker run -d --name ui -p 8080:8080 hotaisle-ui:ci --demo
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root"'
          curl -fsS -H 'X-Requested-With: hotaisle-ui' http://127.0.0.1:8080/local/status | grep -q '"demo_only":true'
