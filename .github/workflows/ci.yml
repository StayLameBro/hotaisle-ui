name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web app and the binary
        run: make build
      - name: Go vet, Go tests, TypeScript check
        run: make test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: The Docker image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: hotaisle-ui:ci
      - name: and serves the app
        run: |
          docker run -d --name ui -p 8080:8080 hotaisle-ui:ci --demo
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root"' 
          curl -fsS -H 'X-Requested-With: hotaisle-ui' http://127.0.0.1:8080/local/status | grep -q '"demo_only":true'
