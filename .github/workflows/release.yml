name: release
on:
  push:
    tags: ['v*']

# Nothing by default; each job asks for only what it needs.
permissions: {}

# Third-party actions are pinned to exact commits (a moved tag can't change what runs);
# Dependabot proposes updates.
jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign the build provenance
      attestations: write # store it
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Cross-compile for macOS, Linux and Windows
        run: make release VERSION=${GITHUB_REF_NAME#v}
      - name: Checksums
        run: cd bin && sha256sum hotaisle-ui-* > SHA256SUMS
      - name: Build provenance (verify with `gh attestation verify <file> -R <owner>/hotaisle-ui`)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: bin/hotaisle-ui-*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" bin/hotaisle-ui-* bin/SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # publish the image
      id-token: write     # sign the build provenance
      attestations: write # store it
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name (lower case, as the registry needs)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=A web app for renting Hot Aisle MI300X GPUs, locally or hosted
            org.opencontainers.image.licenses=MIT
      - name: Build provenance for the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
